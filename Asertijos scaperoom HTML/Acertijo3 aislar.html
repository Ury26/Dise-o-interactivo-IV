<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 en Línea</title>

<style>
body{
    background-image:url("../Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3.png");
    background-size:80%;
    background-repeat:no-repeat;
    background-position:top;
}

#status{
    font-size:20px;
    margin-bottom:15px;
    z-index:10
}

#board{
    position:absolute;

    left:590px;
    top:143px;
    
    z-index:10;

    display:grid;
    grid-template-columns:repeat(6,80px);
    row-gap:17px;      /* arriba-abajo */
    column-gap:3px;    /* izquierda-derecha */
    
}

.cell{
    width:65px;
    height:65px;
    background:#1f2937;
    border:2px solid #374151;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.2s;
}

.cell:hover{
    background:#2d3b55;
}

button{
    margin-top:20px;
    padding:10px 20px;
    background:#f39c12;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#e67e22;
}

svg{
    pointer-events:none;
}

#hotspotReiniciar{
    position:absolute;
    left:700px;
    top:660px;
    width:270px;
    height:50px;
    cursor:pointer;
    background:transparent;
}

#gameContainer{
    width:1920px;
    height:1080px;

    background-image:url("fondo.png");
    background-size:100% 100%;
    background-repeat:no-repeat;

    margin:0 auto;

    position:relative;
}

#status{
    position:absolute;

    left:640px;
    top:100px;

    width:400px;

    text-align:center;

    font-size:20px;

    color:black;
}

#pantallaDerrota{
    display:none;

    position:fixed;

    right:0;
    top:0;

    width:100vw;
    height:100vh;

    z-index:5;

    background-image:url("../Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-mensaje-perdiste.png");
    background-size:79%;
    background-position:52% top;
    background-repeat:no-repeat;
    background-color:white;
}

#btnContinuar{
    position:absolute;

    left:700px;
    top:650px;

    width:250px;
    height:70px;

    cursor:pointer;
    z-index:51
}

.hover-reiniciar{
    background-image:url("../Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-perdiste-hover.png") !important;
}

.ficha{
    width:55px;
    height:55px;

    object-fit:contain;

    pointer-events:none;
}

.hover-reiniciar-juego{
    background-image:url("../Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-hover.png") !important;
}

</style>
</head>
<body>
<div id="gameContainer">

    <div
    id="hotspotReiniciar"
    onclick="location.reload()"
    onmouseenter="document.body.classList.add('hover-reiniciar-juego')"
    onmouseleave="document.body.classList.remove('hover-reiniciar-juego')">
</div>


    <div id="status">
        Nivel 1 - Tu turno
    </div>

    <div id="board"></div>

    <div id="pantallaDerrota">
        <div id="btnContinuar"></div>
    </div>

</div>

<script>

const SIZE = 6;
const WIN = 4;

let board = Array(SIZE*SIZE).fill("");
let playerTurn = true;
let level = 1;
let playerMoves = 0;
let gameOver = false;

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");

function createBoard(){

    for(let i=0;i<SIZE*SIZE;i++){

        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;

        cell.addEventListener("click",()=>{
            playerMove(i);
        });

        boardElement.appendChild(cell);
    }
}

function playerMove(index){

    if(gameOver) return;
    if(!playerTurn) return;
    if(board[index] !== "") return;

    placeMark(index,"X");

    playerMoves++;

    if(checkWinner("X") && level < 3){
    winScreen();
    return;
     }

    if(playerMoves === 2 && level === 1){

        level = 2;

        statusElement.innerHTML =
        "⚠ Nivel 2: El profesor juega dos veces por turno";
    }
    else if(playerMoves === 3 && level === 2){

        level = 3;

        statusElement.innerHTML =
        "⚠ Nivel 3: El profesor juega tres veces por turno";
    }

    playerTurn = false;

    setTimeout(cpuTurn,600);
}

function placeMark(index,mark){

    board[index] = mark;

    const cell =
    document.querySelector(`[data-index="${index}"]`);

    if(mark === "X"){

        cell.innerHTML = `
            <img
                src="../Assets_scaperoom/Bocetos/puzzle3-gato-imposible/icono-alumna.png"
                class="ficha">
        `;

    }else{

        cell.innerHTML = `
            <img
                src="../Assets_scaperoom/Bocetos/puzzle3-gato-imposible/icono-profe.png"
                class="ficha">
        `;
    }
}

function cpuTurn(){

    if(gameOver) return;

    let cpuMoves;

    if(level === 1){
        cpuMoves = 1;
    }
    else if(level === 2){
        cpuMoves = 2;
    }
    else{
        cpuMoves = 3;
    }

    function doMove(moveNumber){

        if(gameOver) return;

        const move = chooseBestMove();

        if(move === null){
            return;
        }

        placeMark(move,"O");

        if(checkWinner("O")){

    if(level === 3){

        

    }else{

        gameOver = true;

        statusElement.innerHTML = `
            <div style="color:#ff5555;font-size:28px;font-weight:bold;">
                Has perdido
            </div>

            <div style="font-size:90px;margin-top:10px;">
                🗝️
            </div>

            <div style="font-size:20px;">
                Premio de consolación:
                Llave misteriosa
            </div>
        `;

        return;
    }
}

        if(moveNumber < cpuMoves - 1){

            setTimeout(()=>{
                doMove(moveNumber + 1);
            },500);
}else{

   if(level === 3){

    setTimeout(() => {
        loseScreen();
    }, 500);

    return;
}

    playerTurn = true;

    statusElement.textContent =
    `Nivel ${level} - Tu turno`;
}
    }

    doMove(0);
}

function chooseBestMove(){

    let empty = [];

    for(let i=0;i<board.length;i++){
        if(board[i] === ""){
            empty.push(i);
        }
    }

    if(empty.length === 0){
        return null;
    }

    for(let i of empty){

        board[i] = "O";

        if(checkWinner("O")){
            board[i] = "";
            return i;
        }

        board[i] = "";
    }

    for(let i of empty){

        board[i] = "X";

        if(checkWinner("X")){
            board[i] = "";
            return i;
        }

        board[i] = "";
    }

    const preferred = [
        14,15,20,21,
        13,16,19,22,
        8,9,10,11
    ];

    for(let pos of preferred){

        if(board[pos] === ""){
            return pos;
        }
    }

    return empty[Math.floor(Math.random()*empty.length)];
}

function checkWinner(symbol){

    const dirs = [
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(let r=0;r<SIZE;r++){

        for(let c=0;c<SIZE;c++){

            for(let [dr,dc] of dirs){

                let count = 0;

                for(let k=0;k<WIN;k++){

                    const nr = r + dr*k;
                    const nc = c + dc*k;

                    if(
                        nr < 0 || nr >= SIZE ||
                        nc < 0 || nc >= SIZE
                    ){
                        break;
                    }

                    if(board[nr*SIZE+nc] === symbol){
                        count++;
                    }
                }

                if(count === WIN){
                    return true;
                }
            }
        }
    }

    return false;
}

function winScreen(){

    gameOver = true;

    statusElement.innerHTML = `
        <div style="color:#4ade80;font-size:28px;font-weight:bold;">
            ¡Has ganado!
        </div>
    `;
}


function loseScreen(){

    gameOver = true;
    document.getElementById("status").style.display = "none";
    document.body.style.backgroundColor = "";
    document.getElementById("pantallaDerrota")
        .style.display = "block";

    const btn = document.getElementById("btnContinuar");
    
    if(btn){

    btn.onmouseenter = () => {
        document.getElementById("pantallaDerrota")
            .style.backgroundImage =
            'url("../Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-perdiste-hover.png")';
    };

    btn.onmouseleave = () => {
        document.getElementById("pantallaDerrota")
            .style.backgroundImage =
            'url("../Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-mensaje-perdiste.png")';
    };

    btn.onclick = () => {
        location.reload();
    };
}
}
createBoard();

</script>

</body>
</html>
