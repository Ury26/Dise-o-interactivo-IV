<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 en Línea</title>

<style>
html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background-color:white;
}

body{
    background-image:none;
}

#status{
    font-size:20px;
    margin-bottom:15px;
    z-index:10
}

#board{
    position:absolute;

    left:50%;
    top:174px;
    transform:translateX(-50%);
    
    z-index:10;

    display:grid;
    grid-template-columns:repeat(6,93px);
    row-gap:28px;
    justify-items:center;
    align-items:center;
    
}

.cell{
    width:65px;
    height:65px;
    background:#1f2937;
    border:2px solid #374151;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.2s;
}

.cell:hover{
    background:#2d3b55;
}

button{
    margin-top:20px;
    padding:10px 20px;
    background:#f39c12;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#e67e22;
}

svg{
    pointer-events:none;
}

#hotspotReiniciar{
    position:absolute;
    left:50%;
    top:770px;
    width:360px;
    height:90px;
    transform:translateX(-50%);
    z-index:20;
    cursor:pointer;
    background:transparent;
    appearance:none;
    margin:0;
    padding:0;
    border:0;
    border-radius:0;
}

#gameContainer{
    width:1920px;
    height:1080px;

    background-image:url("https://raw.githubusercontent.com/marystar102-rgb/Dise-o-interactivo-IV/main/Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3.png");
    background-color:transparent;
    background-size:79%;
    background-repeat:no-repeat;
    background-position:top center;

    margin:0;

    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%) scale(var(--stage-scale, 1));
    transform-origin:center;
}

#status{
    position:absolute;

    left:50%;
    top:40px;

    width:400px;
    transform:translateX(-50%);

    text-align:center;

    font-size:20px;

    color:black;
}

#pantallaDerrota{
    display:none;

    position:absolute;
    inset:0;
    width:100%;
    height:100%;

    z-index:5;

    background-image:url("https://raw.githubusercontent.com/marystar102-rgb/Dise-o-interactivo-IV/main/Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-mensaje-perdiste.png");
    background-size:79%;
    background-position:top center;
    background-repeat:no-repeat;
    background-color:white;
}

#btnContinuar{
    position:absolute;

    left:1098px;
    top:20px;

    width:160px;
    height:130px;

    margin:0;
    padding:0;
    border:0;
    border-radius:0;
    background:transparent;
    cursor:pointer;
    z-index:51
}

#btnContinuar.recompensa-recogida{
    background:#fff;
    cursor:default;
}

.hover-reiniciar{
    background-image:url("https://raw.githubusercontent.com/marystar102-rgb/Dise-o-interactivo-IV/main/Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-perdiste-hover.png") !important;
}

.ficha{
    width:55px;
    height:55px;

    object-fit:contain;

    pointer-events:none;
}

body.hover-reiniciar-juego #gameContainer{
    background-image:url("https://raw.githubusercontent.com/marystar102-rgb/Dise-o-interactivo-IV/main/Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-hover.png");
}

</style>
</head>
<body>
<div id="gameContainer">

    <button
    id="hotspotReiniciar"
    type="button"
    aria-label="Reiniciar">
</button>


    <div id="status">
        Nivel 1 - Tu turno
    </div>

    <div id="board"></div>

    <div id="pantallaDerrota">
        <button
            id="btnContinuar"
            type="button"
            aria-label="Recoger la llave azul"
        ></button>
    </div>

</div>

<script>

const SIZE = 6;
const WIN = 4;

let board = Array(SIZE*SIZE).fill("");
let playerTurn = true;
let level = 1;
let playerMoves = 0;
let gameOver = false;

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");
const restartButton = document.getElementById("hotspotReiniciar");
const keyPickupButton = document.getElementById("btnContinuar");
const defeatScreen = document.getElementById("pantallaDerrota");
const gameContainer = document.getElementById("gameContainer");

function ajustarEscalaJuego(){
    const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
    );
    gameContainer.style.setProperty("--stage-scale", scale);
}

window.addEventListener("resize", ajustarEscalaJuego);
ajustarEscalaJuego();

restartButton.addEventListener("click",()=>{
    restartButton.disabled = true;
    if(getComputedStyle(defeatScreen).display === "none"){
        document.body.classList.add("hover-reiniciar-juego");
    }else{
        defeatScreen.style.backgroundImage =
            'url("https://raw.githubusercontent.com/marystar102-rgb/Dise-o-interactivo-IV/main/Assets_scaperoom/Bocetos/puzzle3-gato-imposible/cuadricula-puzzle3-perdiste-hover.png")';
    }
    setTimeout(()=>window.location.reload(),180);
});

keyPickupButton.addEventListener("click",()=>{
    if(keyPickupButton.disabled){
        return;
    }

    keyPickupButton.disabled = true;
    keyPickupButton.classList.add("recompensa-recogida");
    window.parent.postMessage({type:"puzzle3-key-collected"},"*");
});

function createBoard(){

    for(let i=0;i<SIZE*SIZE;i++){

        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;

        cell.addEventListener("click",()=>{
            playerMove(i);
        });

        boardElement.appendChild(cell);
    }
}

function playerMove(index){

    if(gameOver) return;
    if(!playerTurn) return;
    if(board[index] !== "") return;

    placeMark(index,"X");

    playerMoves++;

    if(checkWinner("X") && level < 3){
    winScreen();
    return;
     }

    if(playerMoves === 2 && level === 1){

        level = 2;

        statusElement.innerHTML =
        "⚠ Nivel 2: El profesor juega dos veces por turno";
    }
    else if(playerMoves === 3 && level === 2){

        level = 3;

        statusElement.innerHTML =
        "⚠ Nivel 3: El profesor juega tres veces por turno";
    }

    playerTurn = false;

    setTimeout(cpuTurn,600);
}

function placeMark(index,mark){

    board[index] = mark;

    const cell =
    document.querySelector(`[data-index="${index}"]`);

    if(mark === "X"){

        cell.innerHTML = `
            <img
                src="https://raw.githubusercontent.com/marystar102-rgb/Dise-o-interactivo-IV/main/Assets_scaperoom/Bocetos/puzzle3-gato-imposible/icono-alumna.png"
                class="ficha">
        `;

    }else{

        cell.innerHTML = `
            <img
                src="https://raw.githubusercontent.com/marystar102-rgb/Dise-o-interactivo-IV/main/Assets_scaperoom/Bocetos/puzzle3-gato-imposible/icono-profe.png"
                class="ficha">
        `;
    }
}

function cpuTurn(){

    if(gameOver) return;

    let cpuMoves;

    if(level === 1){
        cpuMoves = 1;
    }
    else if(level === 2){
        cpuMoves = 2;
    }
    else{
        cpuMoves = 3;
    }

    function doMove(moveNumber){

        if(gameOver) return;

        const move = chooseBestMove();

        if(move === null){
            return;
        }

        placeMark(move,"O");

        if(checkWinner("O")){

    if(level === 3){

        

    }else{

        gameOver = true;

        statusElement.innerHTML = `
            <div style="color:#ff5555;font-size:28px;font-weight:bold;">
                Has perdido
            </div>

            <div style="font-size:90px;margin-top:10px;">
                🗝️
            </div>

            <div style="font-size:20px;">
                Premio de consolación:
                Llave misteriosa
            </div>
        `;

        return;
    }
}

        if(moveNumber < cpuMoves - 1){

            setTimeout(()=>{
                doMove(moveNumber + 1);
            },500);
}else{

   if(level === 3){

    setTimeout(() => {
        loseScreen();
    }, 500);

    return;
}

    playerTurn = true;

    statusElement.textContent =
    `Nivel ${level} - Tu turno`;
}
    }

    doMove(0);
}

function chooseBestMove(){

    let empty = [];

    for(let i=0;i<board.length;i++){
        if(board[i] === ""){
            empty.push(i);
        }
    }

    if(empty.length === 0){
        return null;
    }

    for(let i of empty){

        board[i] = "O";

        if(checkWinner("O")){
            board[i] = "";
            return i;
        }

        board[i] = "";
    }

    for(let i of empty){

        board[i] = "X";

        if(checkWinner("X")){
            board[i] = "";
            return i;
        }

        board[i] = "";
    }

    const preferred = [
        14,15,20,21,
        13,16,19,22,
        8,9,10,11
    ];

    for(let pos of preferred){

        if(board[pos] === ""){
            return pos;
        }
    }

    return empty[Math.floor(Math.random()*empty.length)];
}

function checkWinner(symbol){

    const dirs = [
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(let r=0;r<SIZE;r++){

        for(let c=0;c<SIZE;c++){

            for(let [dr,dc] of dirs){

                let count = 0;

                for(let k=0;k<WIN;k++){

                    const nr = r + dr*k;
                    const nc = c + dc*k;

                    if(
                        nr < 0 || nr >= SIZE ||
                        nc < 0 || nc >= SIZE
                    ){
                        break;
                    }

                    if(board[nr*SIZE+nc] === symbol){
                        count++;
                    }
                }

                if(count === WIN){
                    return true;
                }
            }
        }
    }

    return false;
}

function winScreen(){

    gameOver = true;

    statusElement.innerHTML = `
        <div style="color:#4ade80;font-size:28px;font-weight:bold;">
            ¡Has ganado!
        </div>
    `;
}


function loseScreen(){

    gameOver = true;
    document.getElementById("status").style.display = "none";
    document.body.style.backgroundColor = "";
    document.getElementById("pantallaDerrota")
        .style.display = "block";
}
createBoard();

</script>

<script src="../audio-relay.js"></script>

</body>
</html>
