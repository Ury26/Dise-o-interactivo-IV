<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balanza de Responsabilidad</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#eef5ff url("../Assets_scaperoom/Bocetos/puzzle5-balanza/fondo-balanza.png") center / cover fixed no-repeat;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    color:#1d3557;
}

#game{
    max-width:1000px;
    margin:auto;
}

/* CAJA DE FACTORES */

#cajaPiezas{
    width:90%;
    max-width:850px;
    margin:20px auto;
    padding:15px;
    background:white;
    border:2px solid #888;
    border-radius:12px;
}

#cajaPiezas h3{
    margin-top:0;
}

.pieza{
    display:inline-block;
    margin:6px;
    padding:10px 14px;
    background:#ffd8a8;
    border:2px solid #e67700;
    border-radius:8px;
    cursor:grab;
    user-select:none;
    font-size:14px;
}

.pieza:hover{
    transform:scale(1.05);
}

/* BALANZA */

.balance-layout{
    display:grid;
    grid-template-columns:minmax(0, 2fr) minmax(230px, 1fr);
    align-items:center;
    gap:20px;
    width:min(1100px, 100%);
    margin:20px auto 0;
}

.balance-visual{
    position:relative;
    min-width:0;
    padding-top:34px;
}

.balanza-container{
    position:relative;
    width:100%;
    height:390px;
    margin:0 auto;
}

.base{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:clamp(150px, 20vw, 190px);
    height:auto;
}

.barra{
    position:absolute;
    left:50%;
    top:28px;
    transform:translateX(-50%) rotate(-10deg);
    transform-origin:center center;
    width:min(700px, 100%);
    aspect-ratio:1643 / 453;
    transition:1s ease;
}

.palo-balanza{
    display:block;
    width:100%;
    height:auto;
}

.contenedor{
    position:absolute;
    top:34%;
    width:clamp(110px, 18vw, 160px);
    height:auto;
}

.contenedor-izq{
    left:13%;
}

.contenedor-der{
    right:14%;
}

.cubos{
    position:absolute;
    top:92%;
    width:clamp(110px, 18vw, 160px);
    min-height:60px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:5px;
}

.cubos-izq{
    left:13%;
}

.cubos-der{
    right:14%;
}

.cubo{
    width:28px;
    height:28px;
    background:#4dabf7;
    border:2px solid #1864ab;
}

.factor-colocado{
    width:75px;
    min-height:40px;
    padding:4px;
    border-radius:6px;
    background:#ff8787;
    border:2px solid #c92a2a;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    animation:caer .4s ease;
}

@keyframes caer{
    from{
        transform:translateY(-60px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* ETIQUETAS */

.personas{
    display:flex;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    z-index:2;
}

.etiqueta{
    flex:1;
    font-size:clamp(16px, 2vw, 24px);
    font-weight:bold;
    color:#1d3557;
}

#mensaje{
    box-sizing:border-box;
    margin:0;
    padding:20px;
    border:2px solid #111;
    border-radius:12px;
    background:#fff;
    color:#000;
    line-height:1.55;
    font-size:17px;
    text-align:left;
}

#mensaje:empty{
    visibility:hidden;
    padding:0;
    border:0;
}

.instrucciones{
    max-width:900px;
    margin:auto;
    color:#444;
}

@media(max-width:800px){

    .balance-layout{
        grid-template-columns:minmax(0, 1fr);
        gap:0;
    }

    .balance-visual{
        padding-top:30px;
    }

    .balanza-container{
        height:460px;
    }

    .barra{
        width:calc(100% - 24px);
    }

    #mensaje{
        max-width:600px;
        margin:0 auto 20px;
        font-size:16px;
    }
}
</style>
</head>
<body>

<div id="game">

<h1>Balanza de Responsabilidad</h1>

<p class="instrucciones">
Arrastra cada factor desde la caja hasta el plato del profesor y observa cómo cambia el equilibrio de la balanza.
</p>

<div id="cajaPiezas">

<h3>Factores</h3>

<div class="pieza" draggable="true">Autoridad</div>

<div class="pieza" draggable="true">
Responsabilidad profesional
</div>

<div class="pieza" draggable="true">
Asimetría de poder
</div>

<div class="pieza" draggable="true">
Confianza institucional
</div>

<div class="pieza" draggable="true">
Deber de cuidado
</div>

</div>

<div class="balance-layout">

<div class="balance-visual">
<div class="personas">
<div class="etiqueta">Alumna</div>
<div class="etiqueta">Profesor</div>
</div>

<div class="balanza-container">
<img class="base" src="../Assets_scaperoom/Bocetos/puzzle5-balanza/base-balanza.png" alt="">

<div class="barra" id="barra">

<img class="palo-balanza" src="../Assets_scaperoom/Bocetos/puzzle5-balanza/palo-blanza.png" alt="">
<img class="contenedor contenedor-izq" src="../Assets_scaperoom/Bocetos/puzzle5-balanza/contenedor-uno-balanza.png" alt="">
<img class="contenedor contenedor-der" src="../Assets_scaperoom/Bocetos/puzzle5-balanza/contenedor-dos-balanza.png" alt="">

<div class="cubos cubos-izq">
<div class="cubo"></div>
</div>

<div
class="cubos cubos-der"
id="cubosProfesor"
ondragover="permitirSoltar(event)"
ondrop="soltarPieza(event)">
</div>

</div>

</div>
</div>

<div id="mensaje"></div>

</div>

<script>

let pesos = 0;
let piezaArrastrada = null;

document.querySelectorAll(".pieza").forEach(pieza=>{

    pieza.addEventListener("dragstart",function(){
        piezaArrastrada=this;
    });

});

function permitirSoltar(e){
    e.preventDefault();
}

function soltarPieza(e){

    e.preventDefault();

    if(!piezaArrastrada || pesos>=5){
        return;
    }

    pesos++;

    const factor = document.createElement("div");

    factor.className="factor-colocado";

    factor.textContent=
    piezaArrastrada.textContent;

    document
    .getElementById("cubosProfesor")
    .appendChild(factor);

    piezaArrastrada.remove();

    actualizarBalanza();
}

function actualizarBalanza(){

    const barra=document.getElementById("barra");

    switch(pesos){

        case 1:
            barra.style.transform=
            "translateX(-50%) rotate(-5deg)";
            break;

        case 2:
            barra.style.transform=
            "translateX(-50%) rotate(0deg)";
            break;

        case 3:
            barra.style.transform=
            "translateX(-50%) rotate(8deg)";
            break;

        case 4:
            barra.style.transform=
            "translateX(-50%) rotate(15deg)";
            break;

        case 5:

            barra.style.transform=
            "translateX(-50%) rotate(22deg)";

            document
            .getElementById("mensaje")
            .innerHTML=
            "Esta representación muestra que el profesor tiene una responsabilidad mayor por su autoridad: debe cuidar, respetar los límites y evitar cualquier abuso de poder. La alumna tiene derecho a expresar sus límites y pedir apoyo, pero no es responsable de la conducta del profesor ni de mantener la relación en equilibrio.";

            break;
    }
}

</script>

</body>
</html>
